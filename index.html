<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FAX注文</title>

  <!-- iPhone：ホーム画面のアイコンと名前 -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="FAX注文">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Android・Windows・パソコン用 -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="theme-color" content="#5a4a6e">

  <style>
    html, body { margin: 0; height: 100%; background: #f5f3f8; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- FAX注文（GASアプリ）の画面をこの中に表示 -->
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbweBFqQ_3hq_fmIR12lAtrToWwCSDW2U5SU87Ng6k-H3Xjf1cQrMA93jEJDOObam79j4A/exec?page=fax"></iframe>
  <script>
    // iPhoneのホーム画面アプリでは中の画面の記憶が消えるので、合言葉と送る人をこのページで覚えておく（2026-11-11）
    window.addEventListener('message', function (e) {
      var host = '';
      try { host = new URL(e.origin).hostname; } catch (x) { return; }
      if (!/\.googleusercontent\.com$/.test(host)) return;
      var d = e.data || {};
      try {
        if (d.mf === 'get') {
          e.source.postMessage({ mf: 'vals', faxPin: localStorage.getItem('faxPin') || '', faxWho: localStorage.getItem('faxWho') || '' }, e.origin);
        } else if (d.mf === 'set' && (d.k === 'faxPin' || d.k === 'faxWho')) {
          if (d.v) localStorage.setItem(d.k, d.v); else localStorage.removeItem(d.k);
        }
      } catch (x) {}
    });
  </script>
</body>
</html>
